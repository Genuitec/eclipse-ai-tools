title: "[ChangeReview] "
labels: ["changereview"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for trying ChangeReview early access! Questions about Live Review,
        Inline Compare, or Time Machine without agent changes are welcome in
        [Q&A](https://github.com/Genuitec/eclipse-ai-tools/discussions/categories/q-a).
  - type: dropdown
    id: topic
    attributes:
      label: Topic
      options:
        - Feedback
        - Question
        - Problem
        - Idea
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: What happened, what you expected, or what you'd like ChangeReview to do.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Eclipse, ChangeReview, and GitHub Copilot for Eclipse versions, and your operating system.
      placeholder: "Eclipse 2025-09, ChangeReview 1.0 EA-2, GitHub Copilot 0.20, Windows 11"
